appsecurity:
  allowedOrigin: "https://ninie-web.netlify.app"

bot:
  prefix: "!"

server:
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: none
        secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
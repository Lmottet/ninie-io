<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img"
    aria-label="Ninie badge logo - circular cursive">
    <defs>
        <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Pacifico');
            .bg { fill:#fff3e6; stroke:#FDD14A; stroke-width:7; }
            .word { font-family: 'Pacifico', 'Segoe Script', cursive; font-size:80px; fill:#212531;
            }
            .sub { font-family: Arial, Helvetica, sans-serif; font-size:20px; fill:#7D8291 ;
            letter-spacing:3px; }
        </style>
    </defs>

    <circle class="bg" cx="210" cy="210" r="200" />
    <text class="word" x="210" y="210" text-anchor="middle" dominant-baseline="middle">Ninie</text>
    <text class="sub" x="210" y="260" text-anchor="middle">Book Blog</text>
</svg>